AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Procesamiento automático de imágenes con S3 y Lambda.

Parameters:
  OutputWidth:
    Type: Number
    Default: 800
    MinValue: 1
    MaxValue: 4096
  OutputHeight:
    Type: Number
    Default: 600
    MinValue: 1
    MaxValue: 4096

Resources:
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  ResizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          OUTPUT_WIDTH: !Ref OutputWidth
          OUTPUT_HEIGHT: !Ref OutputHeight
          INPUT_PREFIX: originals/
          OUTPUT_PREFIX: resized/
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ImagesBucket
        - S3WritePolicy:
            BucketName: !Ref ImagesBucket
      Events:
        OriginalCreated:
          Type: S3
          Properties:
            Bucket: !Ref ImagesBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: originals/

Outputs:
  BucketName:
    Value: !Ref ImagesBucket
  FunctionName:
    Value: !Ref ResizeFunction

